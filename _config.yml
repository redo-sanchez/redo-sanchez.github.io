title: Albert Redo-Sanchez
email: aredo@unizar.es
description: >-
  Professor at Universidad de Zaragoza specializing in non-line-of-sight (NLOS)
  imaging, transient imaging, terahertz technology, and computer vision.
  Research group: Graphics and Imaging Lab.
baseurl: ""
url: https://redo-sanchez.github.io
github_username: redo-sanchez
linkedin_username: redosanchez
author: Albert Redo-Sanchez

header_pages:
  - index.md
  - projects.md
  - academic.md
  - professional.md
  - publications.md
  - media.md
  - resources.md
  - about.md

# Not published: source slide decks (the PDF exports are) and repo files
exclude:
  - assets/media/*.pptx
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
  - scripts/

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Default preview image for link-sharing cards (jekyll-seo-tag)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/foto_pro.jpg
