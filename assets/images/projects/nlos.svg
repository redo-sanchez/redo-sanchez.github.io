<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Non-line-of-sight imaging: light bounces off a relay wall to reveal an object hidden behind an occluder</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1b2550"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff6b81" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6b81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="objglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <!-- relay wall -->
  <rect x="826" y="50" width="16" height="500" rx="3" fill="#8b95b8"/>
  <text x="810" y="40" fill="#b9c3e6" font-size="20" text-anchor="end">relay wall</text>

  <!-- occluder: blocks the direct view from the sensor to the hidden object -->
  <rect x="40" y="322" width="360" height="16" rx="3" fill="#8b95b8"/>
  <text x="48" y="366" fill="#b9c3e6" font-size="20">occluder</text>

  <!-- scattered light fanning out from the laser spot on the wall -->
  <g stroke="#ff8fa3" stroke-opacity="0.22" stroke-width="2">
    <line x1="826" y1="420" x2="560" y2="120"/>
    <line x1="826" y1="420" x2="480" y2="200"/>
    <line x1="826" y1="420" x2="520" y2="300"/>
    <line x1="826" y1="420" x2="600" y2="70"/>
  </g>

  <!-- laser: sensor -> wall -->
  <line x1="150" y1="470" x2="826" y2="420" stroke="#ff4d6d" stroke-width="5" stroke-linecap="round"/>
  <!-- wall -> hidden object -->
  <line x1="826" y1="420" x2="210" y2="160" stroke="#ff4d6d" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- hidden object -> wall -> sensor (returning photons) -->
  <line x1="210" y1="160" x2="826" y2="250" stroke="#5eead4" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <line x1="826" y1="250" x2="150" y2="470" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>

  <!-- laser spot and return spot on the wall -->
  <circle cx="826" cy="420" r="34" fill="url(#spot)"/>
  <circle cx="826" cy="420" r="7" fill="#ffd1d9"/>
  <circle cx="826" cy="250" r="6" fill="#c9fff4"/>

  <!-- hidden object: a glowing cube -->
  <circle cx="210" cy="160" r="90" fill="url(#objglow)"/>
  <g stroke="#5eead4" stroke-width="3" fill="none" stroke-linejoin="round">
    <path d="M210 112 L254 136 L210 160 L166 136 Z" fill="#5eead4" fill-opacity="0.18"/>
    <path d="M166 136 L166 186 L210 210 L210 160"/>
    <path d="M254 136 L254 186 L210 210"/>
  </g>
  <text x="210" y="252" fill="#c9fff4" font-size="20" text-anchor="middle">hidden object</text>

  <!-- laser + time-resolved sensor -->
  <g transform="translate(150 470)">
    <rect x="-46" y="-26" width="74" height="52" rx="10" fill="#e8ecf8"/>
    <circle cx="10" cy="0" r="13" fill="#1b2550"/>
    <circle cx="10" cy="0" r="6" fill="#5eead4"/>
  </g>
  <text x="104" y="532" fill="#b9c3e6" font-size="20">laser + time-resolved sensor</text>
</svg>
